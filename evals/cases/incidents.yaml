# Incident cases, re-derived after the identity gate was tightened.
#
# The query for each case is what a user actually pastes: the thread's own title
# plus its first log or code block. The engine must recognise *that same thread*
# - self-identity is checkable ground truth, not a gold label - and any action it
# proposes must cite a real release.
#
# `verified_upstream: true` means the whole chain (symptom -> change -> release)
# was checked by hand on GitHub, so that case asserts an exact commit and target.
# The others assert only what is defensible without that check.
#
# Regenerating: scripts are not committed; the selection below was reviewed by
# hand from the self-match pool and the expectations were written, not scraped.
version: 2
repo: deepseek-ai/deepseek-harness
defaults:
  os: windows
cases:
- id: loader-node24-boot-graph-empty
  kind: incident
  subsystem: loader / client-modules
  verified_upstream: true
  upstream:
    discussion: https://github.com/deepseek-ai/deepseek-harness/discussions/5084
    change: https://github.com/deepseek-ai/deepseek-harness/commit/675efe73f2d83202eccf145f8d9da14905c526d3
    release: https://github.com/deepseek-ai/deepseek-harness/releases/tag/dsh-v0.1.2-alpha.2
  query:
    error: 'Web UI will not come up on this machine. dsh web launches, but the boot

      graph is empty: __DSH_BOOT__ has zero entries, and the browser console says

      client-modules: HTML did not preload @deepseek-ai/dsh-client-modules/client.js

      The host log shows TypeError: e.indexOf is not a function coming out of

      packages/loader/src/internal.ts while resolving a module.

      '
    core_version: 0.1.2-alpha.1
    runtime: node 24.11.1
    os: windows
    packages: ["@deepseek-ai/dsh-client-modules"]
  expect:
    status: probable
    action: upgrade
    target: dsh-v0.1.2-alpha.2
    matched_discussion: 5084
    cites_commit: 675efe73f2d83202eccf145f8d9da14905c526d3
    must_cite_source_types:
    - discussion
    - commit
    - release
    forbid_phrases:
    - verified fixed
    - confirmed fixed
    - runtime verified
    no_unsupported_claims: true
